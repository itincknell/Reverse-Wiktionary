<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>Reverse Wiktionary social preview</title>
  <desc>A branded preview image for Reverse Wiktionary, with a subtle monogram watermark and wiki-inspired wordmark.</desc>
  <defs>
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="58%" stop-color="#f2f7f6"/>
      <stop offset="100%" stop-color="#fff0f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a"/>
      <stop offset="48%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#6b3cff"/>
    </linearGradient>
    <linearGradient id="inkfade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2d30"/>
      <stop offset="100%" stop-color="#38575b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2d30" flood-opacity="0.13"/>
    </filter>
    <pattern id="rule-lines" width="132" height="62" patternUnits="userSpaceOnUse">
      <path d="M0 61.5H132" stroke="#d8e0de" stroke-width="1" opacity="0.36"/>
      <path d="M131.5 0V62" stroke="#e3d7df" stroke-width="1" opacity="0.24"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#page)"/>
  <rect width="1200" height="630" fill="url(#rule-lines)" opacity="0.42"/>

  <g transform="translate(1014 392)">
    <rect width="144" height="144" rx="24" fill="#264f55"/>
    <text
      x="69"
      y="82"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="102"
      font-family="Old English Text MT, UnifrakturCook, UnifrakturMaguntia, Georgia, serif"
      font-weight="700"
      fill="#ffffff"
      letter-spacing="-5">𝕴𝕿</text>
    <text
      x="72"
      y="166"
      text-anchor="middle"
      font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
      font-size="18"
      font-weight="700"
      textLength="144"
      lengthAdjust="spacingAndGlyphs"
      fill="#24383b">Ian-Tincknell.com</text>
  </g>

  <g filter="url(#soft-shadow)">
    <path
      d="M42 60H884C940 60 972 92 972 148V470C972 526 940 558 884 558H42Z"
      fill="#ffffff"
      opacity="0.9"/>
    <path d="M42 60H884C940 60 972 92 972 148V470C972 526 940 558 884 558H42" fill="none" stroke="#dde6e3" stroke-width="2"/>
  </g>

  <g transform="translate(100 102)">
    <text
      x="0"
      y="100"
      font-family="Georgia, Iowan Old Style, Times New Roman, serif"
      font-size="96"
      font-weight="700"
      letter-spacing="-2"
      fill="url(#inkfade)">Reverse</text>
    <text
      x="0"
      y="204"
      font-family="Georgia, Iowan Old Style, Times New Roman, serif"
      font-size="114"
      font-weight="700"
      letter-spacing="-3"
      fill="#24383b">Wiktionary</text>
    <path d="M7 238H704" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <text
      x="4"
      y="318"
      font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
      font-size="40"
      font-weight="600"
      fill="#526669">Find words from meaning.</text>
    <text
      x="4"
      y="372"
      font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
      font-size="28"
      fill="#718184">Dictionary search built from Wiktionary-derived lexical data.</text>
  </g>
</svg>
