{% extends "base.html" %}

{% block body %}
<main class="app-shell">
  <header class="app-header">
    <h1>Reverse Wiktionary</h1>
  </header>

  <section class="workspace">
    <aside class="controls">
      <form
        hx-post="/ui/search"
        hx-target="#results"
        hx-swap="innerHTML"
        class="search-form"
      >
        <label class="field-label" for="query">Search prompt</label>
        <textarea
          id="query"
          name="query"
          rows="5"
          maxlength="500"
          placeholder="a word for remembering the past fondly"
          required
        >{{ state.latest_query or "" }}</textarea>

        <input type="hidden" name="limit" value="{{ state.limit }}">

        {% include "partials/filters.html" %}

        <button class="primary-button" type="submit">Search</button>
      </form>
    </aside>

    <section class="results-pane" aria-live="polite">
      <div id="results" class="results">
        <p class="empty-state">Enter a description and search.</p>
      </div>
    </section>
  </section>
</main>

<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script>
  document.querySelectorAll("[data-filter-search]").forEach((input) => {
    input.addEventListener("input", () => {
      const target = document.querySelector(input.dataset.filterSearch);
      const query = input.value.trim().toLowerCase();
      target.querySelectorAll("[data-filter-option]").forEach((option) => {
        option.hidden = query && !option.dataset.filterOption.includes(query);
      });
    });
  });
</script>
{% endblock %}
