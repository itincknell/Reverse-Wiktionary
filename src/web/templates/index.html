{% extends "base.html" %}

{% block body %}
<main class="app-shell">
  <section class="workspace">
    <aside class="controls">
      <form
        hx-post="/ui/search"
        hx-target="#results"
        hx-swap="innerHTML"
        class="search-form"
        data-search-form
      >
        <label class="field-label" for="query">Search prompt</label>
        <textarea
          id="query"
          name="query"
          rows="5"
          maxlength="500"
          placeholder="Enter a word meaning"
          required
        >{{ state.latest_query or "" }}</textarea>

        <div class="search-actions">
          <button class="primary-button" type="submit">Search</button>
          <button
            class="secondary-button clear-query-button"
            type="button"
            data-clear-query
            aria-label="Clear search prompt"
          >
            Clear
          </button>
        </div>

        <input type="hidden" name="limit" value="{{ state.limit }}">

        {% include "partials/filters.html" %}
      </form>
    </aside>

    <section class="results-pane" aria-live="polite">
      <div id="results" class="results">
        <p class="empty-state">Enter a description and search.</p>
      </div>
    </section>
  </section>
</main>

<script src="/static/language_filter_state.js?v={{ asset_version }}"></script>
<script src="/static/language_filter_dom.js?v={{ asset_version }}"></script>
<script src="/static/language_filter_controller.js?v={{ asset_version }}"></script>
<script src="/static/language_filter_chips.js?v={{ asset_version }}"></script>
<script src="/static/language_filter_search.js?v={{ asset_version }}"></script>
<script src="/static/language_filters.js?v={{ asset_version }}"></script>
<script>
  ReverseWiktionaryLanguageFilters.initializeLanguageFilters();
</script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script src="/static/search_ui.js?v={{ asset_version }}"></script>
{% endblock %}
