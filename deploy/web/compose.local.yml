services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../../data/qdrant/storage:/qdrant/storage
      - ../../data/snapshots:/qdrant/snapshots
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ../../data/redis:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-reverse-wiktionary-web:latest}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    environment:
      APP_ENV: development
      COLLECTION_NAME: ${COLLECTION_NAME:-reverse_wiktionary_v3}
      MODEL_NAME: ${MODEL_NAME:-sentence-transformers/all-mpnet-base-v2}
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HNSW_EF: ${QDRANT_HNSW_EF:-512}
      QDRANT_ACORN_MAX_SELECTIVITY: ${QDRANT_ACORN_MAX_SELECTIVITY:-1.0}
      SEARCH_EXACT_FILTERED: ${SEARCH_EXACT_FILTERED:-false}
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LIMIT: ${DEFAULT_LIMIT:-25}
      MAX_LIMIT: ${MAX_LIMIT:-100}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SECURE_COOKIES: "false"
      AUDIO_FETCH_CONNECT_TIMEOUT_SECONDS: ${AUDIO_FETCH_CONNECT_TIMEOUT_SECONDS:-2}
      AUDIO_FETCH_READ_TIMEOUT_SECONDS: ${AUDIO_FETCH_READ_TIMEOUT_SECONDS:-8}
      AUDIO_FETCH_MAX_BYTES: ${AUDIO_FETCH_MAX_BYTES:-5242880}
      AUDIO_FETCH_USER_AGENT: "${AUDIO_FETCH_USER_AGENT:-Reverse-Wiktionary/1.0 (https://reverse-wiktionary.com)}"
    volumes:
      - ../../data/processed/latest:/app/data/processed/latest:ro
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped
