map $http_cf_connecting_ip $client_ip_for_limit {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

map $http_cf_connecting_ip $client_ip_for_app {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

limit_req_zone $client_ip_for_limit zone=search_per_ip:10m rate=30r/m;

proxy_cache_path /var/cache/nginx/audio
    levels=1:2
    keys_zone=audio_cache:10m
    max_size=512m
    inactive=30d
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "interest-cohort=()" always;

    location = /api/audio-cache {
        limit_req zone=search_per_ip burst=20 nodelay;

        proxy_cache audio_cache;
        proxy_cache_lock on;
        proxy_cache_valid 200 365d;
        add_header X-Audio-Cache $upstream_cache_status always;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        limit_req zone=search_per_ip burst=20 nodelay;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip_for_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
