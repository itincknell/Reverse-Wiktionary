services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ${REVERSE_WIKTIONARY_DATA_ROOT:-/opt/reverse-wiktionary/data}/qdrant/storage:/qdrant/storage
      - ${REVERSE_WIKTIONARY_DATA_ROOT:-/opt/reverse-wiktionary/data}/snapshots:/qdrant/snapshots
    expose:
      - "6333"
      - "6334"
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - ${REVERSE_WIKTIONARY_DATA_ROOT:-/opt/reverse-wiktionary/data}/redis/data:/data
    expose:
      - "6379"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-reverse-wiktionary-web:latest}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    environment:
      APP_ENV: production
      ASSET_VERSION: ${ASSET_VERSION:-local}
      COLLECTION_NAME: ${COLLECTION_NAME:-reverse_wiktionary_v3}
      MODEL_NAME: ${MODEL_NAME:-sentence-transformers/all-mpnet-base-v2}
      MODEL_DEVICE: ${MODEL_DEVICE:-auto}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HNSW_EF: ${QDRANT_HNSW_EF:-512}
      QDRANT_ACORN_MAX_SELECTIVITY: ${QDRANT_ACORN_MAX_SELECTIVITY:-1.0}
      SEARCH_EXACT_FILTERED: ${SEARCH_EXACT_FILTERED:-false}
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LIMIT: ${DEFAULT_LIMIT:-25}
      MAX_LIMIT: ${MAX_LIMIT:-100}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SECURE_COOKIES: "true"
      AUDIO_FETCH_CONNECT_TIMEOUT_SECONDS: ${AUDIO_FETCH_CONNECT_TIMEOUT_SECONDS:-2}
      AUDIO_FETCH_READ_TIMEOUT_SECONDS: ${AUDIO_FETCH_READ_TIMEOUT_SECONDS:-8}
      AUDIO_FETCH_MAX_BYTES: ${AUDIO_FETCH_MAX_BYTES:-5242880}
      AUDIO_FETCH_USER_AGENT: "${AUDIO_FETCH_USER_AGENT:-Reverse-Wiktionary/1.0 (https://reverse-wiktionary.com)}"
    volumes:
      - ${REVERSE_WIKTIONARY_DATA_ROOT:-/opt/reverse-wiktionary/data}/processed/latest:/app/data/processed/latest:ro
    expose:
      - "8000"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REVERSE_WIKTIONARY_DATA_ROOT:-/opt/reverse-wiktionary/data}/logs/nginx:/var/log/nginx
      - ${REVERSE_WIKTIONARY_DATA_ROOT:-/opt/reverse-wiktionary/data}/audio-cache/nginx:/var/cache/nginx/audio
    depends_on:
      - web
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    restart: unless-stopped
    profiles:
      - cloudflare
