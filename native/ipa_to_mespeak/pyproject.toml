[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ipa-to-mespeak"
version = "0.1.0"
description = "Source-backed IPA to meSpeak phoneme compiler/runtime"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.maturin]
bindings = "pyo3"
module-name = "ipa_to_mespeak._native"
python-source = "python"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
